# docker-compose.override.yml
# This file is automatically picked up by Docker Compose during local development.
# It overrides the image reference in docker-compose.yml with a local build.
services:
  metapi:
    image: ~
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        DEBIAN_MIRROR_BASE: ${METAPI_DOCKER_APT_MIRROR_BASE:-http://deb.debian.org/debian}
        DEBIAN_SECURITY_MIRROR_BASE: ${METAPI_DOCKER_APT_SECURITY_MIRROR_BASE:-http://deb.debian.org/debian-security}
        INSTALL_K8S_TOOLS: ${METAPI_INSTALL_K8S_TOOLS:-false}
