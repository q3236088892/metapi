services:
  metapi:
    image: 1467078763/metapi:latest
    ports:
      - "${METAPI_BIND_HOST:-0.0.0.0}:${PORT:-4000}:${PORT:-4000}"
    volumes:
      - "${METAPI_DATA_DIR:-/root/metapi/data}:/app/data"
    environment:
      AUTH_TOKEN: ${AUTH_TOKEN:?AUTH_TOKEN is required}
      PROXY_TOKEN: ${PROXY_TOKEN:?PROXY_TOKEN is required}
      CHECKIN_CRON: "0 8 * * *"
      BALANCE_REFRESH_CRON: "0 * * * *"
      PORT: ${PORT:-4000}
      DATA_DIR: /app/data
      TZ: ${TZ:-Asia/Shanghai}
    restart: unless-stopped
